<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinus-Synthesizer</title>
<style>
:root{
  --bg:#141618; --panel:#26292d; --panel-dark:#1c1e21;
  --text:#eef0f1; --muted:#9aa1a8; --amber:#e2a23b; --teal:#4bb3a3; --red:#d9705f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.wrap{width:100%;max-width:1180px;height:100svh;min-height:0;margin:0 auto;padding:clamp(8px,1.5vh,18px) clamp(10px,2vw,24px);display:flex;flex-direction:column}
header{text-align:center;margin-bottom:clamp(6px,1.2vh,14px);flex:0 0 auto}

h1{font-size:1.4rem;font-weight:650;letter-spacing:.3px;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0}

.chassis{
  background:linear-gradient(180deg,#2c2f33,#201f22);
  border-radius:18px;padding:clamp(10px,1.5vh,18px);border:1px solid #000;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 12px 30px rgba(0,0,0,.5);
  position:relative;flex:1;min-height:0;
}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b6f74,#232527);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.screw.tl{top:10px;left:10px}.screw.tr{top:10px;right:10px}.screw.bl{bottom:10px;left:10px}.screw.br{bottom:10px;right:10px}

.panel-strip{background:var(--panel-dark);border-radius:12px;padding:clamp(8px,1.2vh,14px);border:1px solid #000;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);height:100%;display:flex;flex-direction:column;min-height:0}

.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,16px);margin-bottom:clamp(8px,1.2vh,14px);flex:0 0 auto}
@media(max-width:640px){.sliders{grid-template-columns:1fr}}
@media (orientation:landscape) and (min-width:700px){.sliders{grid-template-columns:repeat(3,1fr)}}


.mod{background:var(--panel);border-radius:12px;padding:clamp(7px,1vh,12px) 12px;text-align:center;border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.mod label{display:block;font-size:.9rem;font-weight:650;color:var(--text);margin-bottom:4px}
.mod .hint{display:block;color:var(--muted);font-size:.78rem;line-height:1.25;margin-bottom:8px}

.mod input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:pan-x}
.mod input[type=range]::-webkit-slider-runnable-track{height:6px;background:#3a3e43;border-radius:3px}
.mod input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--amber);
  margin-top:-11px;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--amber),0 2px 4px rgba(0,0,0,.5)
}
.mod input[type=range]::-moz-range-track{height:6px;background:#3a3e43;border-radius:3px}
.mod input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--amber);border:3px solid var(--panel)}
.mod.teal input[type=range]::-webkit-slider-thumb{background:var(--teal);box-shadow:0 0 0 1px var(--teal),0 2px 4px rgba(0,0,0,.5)}
.mod.teal input[type=range]::-moz-range-thumb{background:var(--teal)}

.readout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;background:var(--panel-dark);border-radius:6px;padding:4px 8px;display:inline-block;color:var(--amber);letter-spacing:.5px;margin-top:6px}
.mod.teal .readout{color:var(--teal)}

.screen-wrap{background:var(--panel-dark);border-radius:12px;padding:8px;border:1px solid #000;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);flex:1;min-height:0;display:flex}
canvas{width:100%;height:100%;display:block;background:#10231f;border-radius:8px}

.toggles{display:flex;flex-wrap:wrap;gap:18px;margin:16px 4px 4px;color:var(--text);font-size:.9rem}
.toggles label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:34px}
.toggles input{width:20px;height:20px;accent-color:var(--teal)}

.controls-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:clamp(8px,1.2vh,14px);flex:0 0 auto}
.big-btn{
  min-height:clamp(44px,6vh,56px);min-width:150px;flex:1 1 150px;max-width:220px;border-radius:10px;border:1px solid #000;
  font-size:1rem;font-weight:600;cursor:pointer;padding:0 18px;
  box-shadow:0 3px 0 rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.1) inset;
}
.big-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4) inset}
#playBtn{background:var(--teal);color:#0d1f1c}
#playBtn.playing{background:var(--red);color:#241210}
#resetBtn{background:#3a3e43;color:var(--text)}

.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3a3e43;margin-right:8px;vertical-align:middle;box-shadow:inset 0 0 2px rgba(0,0,0,.6)}
.led.on{background:var(--teal);box-shadow:0 0 8px var(--teal)}

footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:clamp(4px,0.7vh,8px);flex:0 0 auto}
#audioMsg{text-align:center;color:var(--muted);font-size:.82rem;min-height:18px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
#audioMsg.error{color:var(--red)}

/* --- Handy-Modus: schmale/kurze Bildschirme scrollen statt zu quetschen --- */
@media (max-width:480px), (max-height:560px){
  html,body{height:auto}
  body{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wrap{height:auto;min-height:100svh}
  .chassis{flex:none}
  .panel-strip{height:auto}
  .screen-wrap{flex:none;height:min(48vh,300px);min-height:200px}
  .sliders{grid-template-columns:1fr}
  h1{font-size:1.2rem}
  .big-btn{min-width:0;max-width:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Sinus-Synthesizer</h1>
</header>

<div class="chassis">
  <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>

  <div class="panel-strip">
    <div class="sliders">
      <div class="mod">
        <label for="sliderA">Amplitude</label>
        <input type="range" id="sliderA" min="0.2" max="2.5" step="0.05" value="1">
        <div class="readout" id="valA">1</div>
      </div>
      <div class="mod teal">
        <label for="sliderT">Periodenlänge</label>
        <input type="range" id="sliderT" min="10" max="80" step="1" value="40">
        <div class="readout" id="valT">2π</div>
      </div>
      <div class="mod">
        <label for="sliderD">Ruhelage</label>
        <input type="range" id="sliderD" min="-2" max="2" step="0.1" value="0">
        <div class="readout" id="valD">0</div>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="graph" width="1600" height="800"></canvas>
    </div>

    <div class="toggles">
      <label><input type="checkbox" id="chkPeriod"> Eine Schwingung markieren</label>
      <label><input type="checkbox" id="chkNodes"> Mittellinie anzeigen</label>
    </div>

    <div class="controls-row">
      <button class="big-btn" id="playBtn"><span class="led" id="playLed"></span>▶ Ton abspielen</button>
      <button class="big-btn" id="resetBtn">Zurücksetzen</button>
    </div>
    <div id="audioMsg" role="status" aria-live="polite"></div>
  </div>
</div>
<footer>Regler ändern → Graph beobachten → Ton anhören</footer>
</div>

<script>
const sA=document.getElementById('sliderA'), sT=document.getElementById('sliderT'), sD=document.getElementById('sliderD');
const valA=document.getElementById('valA'), valT=document.getElementById('valT'), valD=document.getElementById('valD');
const chkPeriod=document.getElementById('chkPeriod'), chkNodes=document.getElementById('chkNodes');
const playBtn=document.getElementById('playBtn'), resetBtn=document.getElementById('resetBtn');
const canvas=document.getElementById('graph'), ctx=canvas.getContext('2d');
const audioMsg=document.getElementById('audioMsg');

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio || 1, 2);
  const w=Math.max(1, Math.round(rect.width*dpr));
  const h=Math.max(1, Math.round(rect.height*dpr));
  if(canvas.width!==w || canvas.height!==h){
    canvas.width=w; canvas.height=h;
  }
  draw();
}

function tFromSlider(v){ return (v/20)*Math.PI; }
function fmtPi(t){
  const kr = Math.round((t/Math.PI)*100)/100;
  if(Math.abs(kr-2)<0.001) return '2π';
  if(Math.abs(kr-4)<0.001) return '4π';
  if(Math.abs(kr-1)<0.001) return 'π';
  return kr.toFixed(2).replace(/\.00$/,'') + 'π';
}

let A=1, T=2*Math.PI, D=0;

function update(){
  A = parseFloat(sA.value);
  T = tFromSlider(parseFloat(sT.value));
  D = parseFloat(sD.value);
  valA.textContent = A.toFixed(1);
  valT.textContent = fmtPi(T);
  valD.textContent = D.toFixed(1);
  resizeCanvas();
  updateAudio();
}

function draw(){
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const xRange = 4*Math.PI + 0.6;
  const marginL=70, marginR=30, marginT=40, marginB=50;
  const plotW=w-marginL-marginR, plotH=h-marginT-marginB;
  const yMax=3.2, yMin=-3.2;
  const xToPx = x => marginL + ((x + xRange) / (2*xRange)) * plotW;
  const yToPx = y => marginT + (1 - (y - yMin)/(yMax-yMin)) * plotH;

  ctx.strokeStyle='#3a5a52'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(marginL, yToPx(0)); ctx.lineTo(w-marginR, yToPx(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xToPx(0), marginT); ctx.lineTo(xToPx(0), h-marginB); ctx.stroke();

  ctx.fillStyle='#7fa89e'; ctx.font='24px ui-monospace,monospace'; ctx.textAlign='center';
  for(let k=-4;k<=4;k++){
    const x = k*Math.PI;
    if(Math.abs(x)>xRange) continue;
    const px=xToPx(x);
    ctx.beginPath(); ctx.moveTo(px,yToPx(0)-6); ctx.lineTo(px,yToPx(0)+6); ctx.strokeStyle='#3a5a52'; ctx.stroke();
    let lbl = k===0?'0': (k===1?'π': k===-1?'-π': k+'π');
    ctx.fillText(lbl, px, yToPx(0)+34);
  }
  ctx.textAlign='right';
  for(let y=-3;y<=3;y++){
    if(y===0) continue;
    const py=yToPx(y);
    ctx.beginPath(); ctx.moveTo(xToPx(0)-6,py); ctx.lineTo(xToPx(0)+6,py); ctx.strokeStyle='#3a5a52'; ctx.stroke();
    ctx.fillText(y, xToPx(0)-14, py+8);
  }
  ctx.font='22px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText('x', w-marginR+6, yToPx(0)+8);
  ctx.textAlign='center';
  ctx.fillText('f(x)', xToPx(0), marginT-14);

  if(chkNodes.checked){
    ctx.setLineDash([10,8]);
    ctx.strokeStyle='#e2a23b'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(marginL, yToPx(D)); ctx.lineTo(w-marginR, yToPx(D)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#e2a23b'; ctx.font='22px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText('Mittellinie', marginL+10, yToPx(D)-12);
    ctx.fillStyle='#e2a23b';
    for(let k=-8;k<=8;k++){
      const x = k*T/2;
      if(Math.abs(x)>xRange) continue;
      const px=xToPx(x), py=yToPx(D);
      ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
    }
  }

  if(chkPeriod.checked){
    const x0=0, x1=T;
    ctx.fillStyle='rgba(75,179,163,.16)';
    ctx.fillRect(xToPx(x0), marginT, xToPx(x1)-xToPx(x0), plotH);
  }

  if(document.activeElement===sA){
    ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(226,162,59,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(marginL, yToPx(D+A)); ctx.lineTo(w-marginR, yToPx(D+A)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(marginL, yToPx(D-A)); ctx.lineTo(w-marginR, yToPx(D-A)); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle='#4bb3a3'; ctx.lineWidth=4; ctx.beginPath();
  const steps=600;
  for(let i=0;i<=steps;i++){
    const x = -xRange + (2*xRange)*(i/steps);
    const y = A*Math.sin((2*Math.PI/T)*x) + D;
    const px=xToPx(x), py=yToPx(Math.max(yMin,Math.min(yMax,y)));
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
}

// --- audio ---
let playing = false;
let audioCtx = null, oscillator = null, gainNode = null;

function currentAudioValues(){
  const baseFreq = 220;
  const freq = Math.max(80, Math.min(1200, baseFreq * (2*Math.PI/T)));
  const vol = Math.max(0, Math.min(1, A/2.5)) * 0.4;
  return {freq, vol};
}

function updateAudio(){
  if(!playing || !audioCtx || !oscillator || !gainNode) return;
  const {freq, vol} = currentAudioValues();
  const now = audioCtx.currentTime;
  oscillator.frequency.setTargetAtTime(freq, now, 0.03);
  gainNode.gain.setTargetAtTime(vol, now, 0.03);
  audioMsg.className='';
  audioMsg.textContent = 'Ton läuft — ' + Math.round(freq) + ' Hz';
}

async function startAudio(){
  audioMsg.className='';
  audioMsg.textContent='';
  const {freq, vol} = currentAudioValues();

  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) throw new Error('Dieser Browser unterstützt keine Web-Audio-Wiedergabe.');
    if(!audioCtx) audioCtx = new Ctx();
    await audioCtx.resume();

    oscillator = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.03);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();

    playing = true;
    playBtn.innerHTML = '<span class="led on"></span>■ Ton stoppen';
    playBtn.classList.add('playing');
    audioMsg.textContent = 'Ton läuft — ' + Math.round(freq) + ' Hz';
  }catch(err){
    playing = false;
    audioMsg.className='error';
    audioMsg.textContent = 'Ton konnte nicht gestartet werden: ' + err.message;
    console.error(err);
  }
}

function stopAudio(){
  if(oscillator){
    try{ oscillator.stop(); }catch(e){}
    oscillator.disconnect();
    oscillator = null;
  }
  if(gainNode){
    gainNode.disconnect();
    gainNode = null;
  }

  playing = false;
  playBtn.innerHTML = '<span class="led"></span>▶ Ton abspielen';
  playBtn.classList.remove('playing');
  audioMsg.className='';
  audioMsg.textContent='';
}

playBtn.addEventListener('click', ()=>{
  if(!playing) startAudio(); else stopAudio();
});


resetBtn.addEventListener('click', ()=>{
  sA.value=1; sT.value=40; sD.value=0;
  update();
});

[sA,sT,sD].forEach(s=>s.addEventListener('input', update));
chkPeriod.addEventListener('change', draw);
chkNodes.addEventListener('change', draw);
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 100));

update();
</script>
</body>
</html>
